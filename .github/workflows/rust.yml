name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy,rustfmt,llvm-tools
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest,cargo-llvm-cov
    - name: typos
      uses: crate-ci/typos@v1.27.3
    - name: fmt
      run: cargo fmt --check
    - name: djinn-core stays free of the inference stack
      run: |
        if cargo tree -p djinn-core --prefix none | grep -E "^(candle-|tokenizers |hf-hub )"; then
          echo "djinn-core must not depend on candle, tokenizers, or hf-hub" >&2
          exit 1
        fi
    - name: djinn-agent stays independent of the inference stack and the server
      run: |
        if cargo tree -p djinn-agent --prefix none | grep -E "^(candle-|djinn-models |djinn-server )"; then
          echo "djinn-agent must not depend on candle, djinn-models, or djinn-server" >&2
          exit 1
        fi
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Check schema files are up to date
      run: |
        cargo xtask schema
        git diff --exit-code configs/
    - name: coverage
      run: cargo llvm-cov nextest --all --fail-under-lines 30
    - name: generate lcov
      run: cargo llvm-cov --no-run --lcov --output-path lcov.info
    - name: upload coverage
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
