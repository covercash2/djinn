[package]
name = "djinn-core"
version.workspace = true
edition.workspace = true
authors.workspace = true


[dependencies]
cfg-if.workspace = true
clap.workspace = true
rand.workspace = true
schemars.workspace = true
jsonschema.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }
xdg.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[features]
default = []
# Enables `clap::Args` derives on core config structs (`RunConfig`),
# allowing them to be embedded directly in CLI commands.
# Note: `clap` is already an unconditional dependency (used by `Device::ValueEnum`
# and `ModelArchitecture::ValueEnum`); this feature only gates the additional `Args` derives.
clap = []
fixed-seed = []
openapi = ["dep:utoipa"]
