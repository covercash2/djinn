[workspace]
members = ["djinn-agent", "djinn-cli", "djinn-core", "djinn-models", "djinn-server", "xtask"]
default-members = ["djinn-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Chris Overcash"]

[workspace.dependencies]
accelerate-src = "0.3.2"
anyhow = "1.0.97"
async-stream = "0.3.6"
axum = { version = "0.8.3", features = ["macros"] }
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
candle-transformers = { version = "0.11.0" }
cfg-if = "1.0.0"
clap = { version = "4.5.35", features = ["derive", "env"] }
derive_builder = "0.20.2"
djinn-core = { path = "./djinn-core" }
djinn-models = { path = "./djinn-models" }
djinn-server = { path = "./djinn-server" }
futures = "0.3.31"
hf-hub = { version = "0.4.2", features = ["tokio"] }
http-body-util = "0.1"
metal = "0.32.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2"
project-root = "0.2.2"
rand = "0.9.0"
schemars = { version = "0.8", features = ["derive"] }
jsonschema = "0.29"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
insta = { version = "1", features = ["toml", "json"] }
tempfile = "3"
thiserror = "2.0.12"
tokenizers = "0.21.1"
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = { version = "0.1.17", features = ["full"] }
tower = { version = "0.5.2", features = ["log", "timeout", "util"] }
tower-http = { version = "0.6.2", features = ["trace"]}
toml = "0.8.20"
tracing = "0.1.41"
tracing-chrome = "0.7.2"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.19"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
xdg = "2.5.2"
