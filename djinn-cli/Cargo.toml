[package]
name = "djinn-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
async-stream.workspace = true
axum = { workspace = true, features = ["macros"] }
clap = { workspace = true, features = ["derive", "string"] }
djinn-core.workspace = true
djinn-models.workspace = true
djinn-server.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-chrome.workspace = true
tracing-log.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = []
# Hardware acceleration is selected on `djinn-models`; these forward to it so that
# `--features mac` / `--features cuda` work when building this package.
mac = ["djinn-models/mac"]
cuda = ["djinn-models/cuda"]
